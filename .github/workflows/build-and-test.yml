name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  validate-dotnet:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: FixedMathSharp
    env:
      # PRs use their target branch; develop -> main validates released packages.
      UseLocalLsfStack: ${{ (github.base_ref == 'develop' || github.ref == 'refs/heads/develop') && 'true' || 'false' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: FixedMathSharp
          fetch-depth: 0
          persist-credentials: false

      # Immutable sibling revisions are used only for develop source validation.
      - if: env.UseLocalLsfStack == 'true'
        uses: actions/checkout@v6
        with:
          repository: mrdav30/Chronicler
          ref: c547e5c633ec71bb3cd0e072720a75fb9b8580ad
          path: Chronicler
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          targetPath: FixedMathSharp

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.configuration }}-lsf-${{ env.UseLocalLsfStack }}-nuget-
            ${{ runner.os }}-lsf-${{ env.UseLocalLsfStack }}-nuget-

      # Pass globally so sibling projects preserve explicit source-reference identities.
      - name: Restore dependencies
        run: dotnet restore FixedMathSharp.slnx --property:Configuration=${{ matrix.configuration }} -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} -m:1

      - name: Build Solution
        run: |
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Assembly Version: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          dotnet build FixedMathSharp.slnx --configuration ${{ matrix.configuration }} --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} -m:1 -p:BuildInParallel=false

      - name: Run Tests
        run: dotnet test FixedMathSharp.slnx --configuration ${{ matrix.configuration }} --no-build --no-restore -p:UseLocalLsfStack=${{ env.UseLocalLsfStack }} -p:DisableTransitiveProjectReferences=${{ env.UseLocalLsfStack }} -m:1 --verbosity normal
